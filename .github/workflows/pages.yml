name: Deploy ATLAS public UI

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/check_public.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout only public code
        uses: actions/checkout@v4
      - name: Validate public release contents
        run: python3 scripts/check_public.py
      - name: Syntax-check public JS
        run: node --check docs/assets/app.js
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload only the docs site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy public website
        id: deploy
        uses: actions/deploy-pages@v4
