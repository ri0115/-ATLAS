name: Regional API tests
on:
  push:
    branches: [main]
    paths:
      - "scripts/region-profile-api*.js"
      - ".github/workflows/region-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --test scripts/region-profile-api.test.js
